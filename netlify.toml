# Netlify hosts the Fit Focus FRONTEND (the static React build).
#
# There is no backend on Netlify, so the app runs in built-in DEMO MODE: when no
# API is reachable it serves seeded sample data locally so every screen and flow
# works. Data is per-session and resets on refresh.
#
# To later point this at a real backend (Express API + SQLite + video streaming
# on an always-on host), add an /api proxy above the SPA fallback, e.g.:
#   [[redirects]]
#     from = "/api/*"
#     to = "https://YOUR-BACKEND-HOST/api/:splat"
#     status = 200
#     force = true

[build]
  command = "npm install && npm run build --workspace client"
  publish = "client/dist"

# SPA fallback so client-side routes resolve to the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
